services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - config.env
    volumes:
      - temp_data:/app/temp
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  temp_data:
